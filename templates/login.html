
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Login</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            display: grid;
            place-items: center;
            min-height: 90vh;
            margin: 0;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 340px;
            max-width: 100%;
        }

        input, button {
            width: 100%;
            padding: 11px;
            margin: 9px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            color: #b91c1c;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 12px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Smart Classroom</h2>
    <h3>Lecturer Login</h3>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <a class="forgot" href="{{ url_for('forgot_password') }}">
        Forgot Password?
    </a>

</div>

</body>
</html>
