
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: grid;
            place-items: center;
            min-height: 90vh;
            margin: 0;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 340px;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Smart Classroom</h2>
    <h3>Reset Password</h3>

    <p>Enter your OTP and create a new password.</p>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">

        <input
            type="text"
            name="otp"
            placeholder="Enter 6-digit OTP"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            required
        >

        <input
            type="password"
            name="new_password"
            placeholder="New Password (minimum 8 characters)"
            minlength="8"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            minlength="8"
            required
        >

        <button type="submit">Reset Password</button>

    </form>

</div>

</body>
</html>
