
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Lecturer</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            display: grid;
            place-items: center;
            min-height: 90vh;
            margin: 0;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 340px;
            max-width: 100%;
        }

        input, button {
            width: 100%;
            padding: 11px;
            margin: 9px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            color: #166534;
        }

        label {
            font-size: 14px;
            color: #374151;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Smart Classroom</h2>
    <h3>Create Lecturer Account</h3>

    {% for message in get_flashed_messages() %}
        <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">

        <input
            type="text"
            name="lecturer_name"
            placeholder="Lecturer Name"
            maxlength="100"
            required
        >

        <input
            type="text"
            name="username"
            placeholder="Username"
            maxlength="50"
            required
        >

        <label for="mobile_number">Registered Mobile Number</label>

        <input
            type="tel"
            id="mobile_number"
            name="mobile_number"
            placeholder="Enter Mobile Number"
            maxlength="20"
            pattern="[0-9+() -]{7,20}"
            title="Enter a valid mobile number"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password (minimum 8 characters)"
            minlength="8"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            minlength="8"
            required
        >

        <button type="submit">Register Lecturer</button>

    </form>

    <br>

    <a href="{{ url_for('home') }}">Back to Dashboard</a>

</div>

</body>
</html>
